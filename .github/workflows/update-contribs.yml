name: Update contribution stats

on:
  schedule:
    - cron: "0 0 * * 1"   # every Monday 00:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: profile-contribution-refresh
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Run contribution updater
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m unittest discover -s tests -v
          python scripts/update_contribs.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/contributions.svg assets/contributions.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: refresh public upstream contribution snapshot"
            git push
          fi
